name: Deploy Tara Luxe Platform to Cloudflare

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Build & Deploy Worker + Pages
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: |
          npm clean-install --progress=false
          npm run install:all

      - name: Build All Services
        run: npm run build

      - name: Deploy Backend Worker (tara-luxe-in)
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy Storefront Pages (tara-luxe-in)
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: npx wrangler pages deploy apps/storefront/dist --project-name tara-luxe-in --branch main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy Admin Center Pages (tara-luxe-admin)
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: npx wrangler pages deploy apps/admin-panel/dist --project-name tara-luxe-admin --branch main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
